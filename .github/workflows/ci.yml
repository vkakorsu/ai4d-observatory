name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Fails on any high or critical advisory in runtime dependencies (Section 3.1.6 b, 3.1.9 e).
      # Two moderate advisories are accepted and recorded in docs/THIRD_PARTY_REGISTER.md.
      - run: pnpm audit --prod --audit-level=high
